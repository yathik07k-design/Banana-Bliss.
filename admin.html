<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Banana Bliss - Admin Dashboard</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <script>
if (localStorage.getItem("adminLoggedIn") !== "true") {
    window.location.href = "login.html";
}
</script>

    <!-- Admin Navigation -->
    <nav class="admin-navbar">
    <div class="admin-logo">
        🍌 Banana Bliss
        <span>Admin Panel</span>
    </div>

    <ul>
        <li><a href="admin.html" class="active">Dashboard</a></li>
        <li><a href="orders.html">Orders</a></li>
        <li><a href="products.html">Products</a></li>
        <li><a href="index.html">Website</a></li>
    </ul>
</nav>

    <!-- Main Container -->
    <div class="container">

        <h1>🍌 Banana Bliss</h1>
        <h2>Admin Dashboard</h2>

       <div id="notification" class="notification-box"></div>

        <button onclick="logout()">🚪 Logout</button>

        <!-- Dashboard Cards -->
        <div class="dashboard-cards">

            <div class="card">
                <h3>📦 Total Orders</h3>
                <h1 id="totalOrders">0</h1>
            </div>

            <div class="card">
                <h3>💰 Total Sales</h3>
                <h1 id="totalSales">₹0</h1>
            </div>

            <div class="card">
                <h3>🛒 Products Sold</h3>
                <h1 id="productsSold">0</h1>
            </div>

        </div>

        <h2>Recent Orders</h2>

        <table id="ordersTable">
            <thead>
                <tr>
                    <th>Invoice</th>
                    <th>Date</th>
                    <th>Total</th>
                    <th>Payment</th>
                </tr>
            </thead>

            <tbody id="ordersBody">
            </tbody>
        </table>

    </div>

    <script src="admin.js"></script>
    <audio id="notifySound" src="https://actions.google.com/sounds/v1/alarms/digital_watch_alarm_long.ogg"></audio>
    <script>
function logout() {
    localStorage.removeItem("adminLoggedIn");
    window.location.href = "login.html";
}
</script>

</body>
</html>
